schema: spec-driven

context: |
  Tamarix использует spec-driven development с единым OpenSpec Store tamarix-specs.
  Все спецификации и изменения находятся в центральном
  репозитории tamarix-specs; кодовые репозитории содержат только openspec/config.yaml
  с указателем store: tamarix-specs, без локальных openspec/specs и openspec/changes.

  Каталог openspec/context/ от корня tamarix-specs предназначен для
  пользовательской документации. OpenSpec не загружает его содержимое
  автоматически. Перед подготовкой и реализацией изменений AI-агент должен
  проверять наличие этого каталога и явно читать существующие документы,
  относящиеся к задаче. Если каталога или нужных документов нет, отметить
  их отсутствие; не выдумывать содержимое отсутствующих документов.

  Кодовые репозитории Tamarix:
  - container-adm-api
  - db-control
  - entity-subject-adm-api
  - entity-object-adm-api
  - policy-adm-api
  - policy-decision-api
  - access-assignment-api

  По указанию пользователя от 2026-10-14 предметные межсервисные integration/e2e
  тесты размещаются в отдельном TamarixTests с store: tamarix-specs.
  Его specs/changes/tasks принадлежат этому store; unit/component тесты остаются
  в сервисах. TamarixCD сохраняет запуск/доставку/smoke и локальное CD planning,
  подготавливает среду и вызывает внешний runner. Процесс принят в ADR 0004;
  перед design/tasks, тестами и предметным archive явно читать
  openspec/context/testing.md. Runner, registry и CI gate ещё требуют реализации.
  Тесты сохраняют постоянные пути и стабильные ID; candidate -> regression
  меняет отбор в registry.yaml. Перед предметным archive нужны traceability,
  успешные новые случаи и текущий регресс на фиксированных версиях,
  verification/evidence и зафиксированный promotion. Инструкции config/AGENTS
  не заменяют проектную обёртку archive и обязательную CI-проверку store.

  Все автоматизированные тесты проекта, включая unit/component/contract,
  integration/e2e, регресс и CD/tooling, MUST иметь описание на русском языке:
  что проверяется, исходные условия, ожидаемый результат и назначение проверки.
  В Python использовать docstring теста; различающиеся параметризованные случаи
  пояснять по-русски. В TamarixTests описание также хранить в registry.yaml
  и показывать в отчёте runner. Технические ID, имена функций и пути сохранять.

  Тесты запускаются по требованию пользователя/ручного CI job или в рамках
  уже согласованной задачи проверки, с выбором test ID/change/уровня/регресса.
  Повторное подтверждение согласованного запуска не нужно; фоновые/периодические
  автозапуски и триггеры commit/старт/archive без отдельного требования не добавлять.
  Каждый прогон формирует отдельный русский отчёт и JSON с набором, версиями,
  временем/длительностью, итогами каждого случая, ошибками и артефактами,
  включая неуспех/отмену. Archive gate проверяет отчёт и не запускает тесты неявно.

  Спецификации организуются по доменам и capabilities, а не по сервисам.
  Согласованное дерево: entities/subjects, entities/objects, containers, access-model.
  containers — capability без второго уровня; access-model пока только
  группирующий домен без определённых capabilities. Не создавать spec.md
  для заполнения этих каталогов и не придумывать поддомены. entities — родительский домен,
  спецификации его capabilities находятся в entities/subjects и entities/objects.
  Заготовки spec.md не являются утверждёнными требованиями.
  Распределение ответственности между сервисами, стек, API и бизнес-правила
  уточняются по коду и согласованным изменениям; не выводить их только из имён.

  Утверждённый стек: Python (последний стабильный релиз, без prerelease),
  PostgreSQL, FastAPI (REST API), Pydantic (валидация и сериализация),
  SQLAlchemy (ORM), Psycopg 3 (драйвер PostgreSQL), Alembic и uv.
  Для всех компонентов действует latest stable; конкретные совместимые версии
  фиксируются после проверки официальных релизов. Базовые версии согласуются
  между сервисами. Проект и зависимости описываются в pyproject.toml,
  PyPI-зависимости фиксируются в uv.lock, Python — в .python-version.
  Воспроизводимая установка: uv sync --frozen; предварительно uv lock --check
  проверяет согласованность манифеста и lock-файла. Обновления — после проверки
  совместимости и тестов; PostgreSQL major upgrade и миграции оценивать отдельно.

  Репозиторий db-control — единственный владелец DDL и Alembic-миграций PostgreSQL.
  Остальные сервисы не создают собственных миграций и не управляют схемой
  самостоятельно. Владельцы предметных данных, топология БД, runtime-доступ
  и порядок исполнения миграций остаются отдельными открытыми решениями.

  Постоянный архитектурно-технологический контекст находится в openspec/context/.
  Начинать с openspec/context/README.md и корневого AGENTS.md центрального store.
  OpenSpec не автозагружает пользовательские Markdown-файлы context: агент
  должен явно прочитать документы. Факты, рекомендации и TBD разделять;
  принятие архитектурных решений проверять по openspec/context/adr/README.md и связанным ADR.

  Писать пояснения на русском языке. Сохранять имена сервисов, пути,
  структурные заголовки OpenSpec и нормативные ключевые слова SHALL/MUST.

rules:
  proposal:
    - "Перед proposal явно прочитать openspec/context/README.md и architecture-principles.md; для затронутой области прочитать соответствующие context docs и применимые ADR."
    - "Описывать проблему, цель, границы изменения и то, что в него не входит."
    - "Перечислять новые и изменяемые capabilities с полными путями, а также затронутые репозитории из списка Tamarix."
    - "Отмечать неизвестные требования и открытые вопросы; не представлять предположения как согласованное поведение."
  specs:
    - "Сверяться с предметным словарём openspec/context/README.md; рекомендации context не превращать в требования без согласованного изменения поведения."
    - "Описывать проверяемое поведение capability; не привязывать структуру спецификаций к именам сервисов."
    - "Использовать формат OpenSpec: ### Requirement:, SHALL/MUST и хотя бы один #### Scenario: с WHEN/THEN для каждого требования. Для каждой существенной фичи сценарии новых и изменяемых требований MUST содержать явные критерии приёмки (acceptance criteria) с наблюдаемым ожидаемым результатом; включать основной, негативные и граничные сценарии, где применимо."
    - "Размещать delta specs по тем же полным путям capabilities, что и основные specs; соблюдать ADDED/MODIFIED/REMOVED/RENAMED Requirements."
    - "Не выдумывать требования для заполнения заготовок; не создавать spec.md для containers или access-model без согласованного change; containers не требует второго уровня, access-model пока только группирует будущие capabilities."
  design:
    - "Перед design.md явно прочитать openspec/context/README.md, architecture-principles.md, technology-stack.md, service-architecture.md и openspec/context/adr/README.md с применимыми ADR; указать прочитанные источники и статусы решений."
    - "Для данных/DDL/миграций прочитать openspec/context/data-architecture.md; для контрактов — api-guidelines.md; для авторизации/доверия/аудита — security.md; при выборе паттернов — patterns.md. Не выбирать TBD-технологии или ownership по умолчанию."
    - "При выборе или обновлении зависимостей соблюдать утверждённый technology-stack.md: latest stable без prerelease, проверка официальных релизов и совместимости, согласованные базовые версии между сервисами, фиксация Python и зависимостей."
    - "Изменения DDL и Alembic-миграций PostgreSQL проектировать только в db-control; другие сервисы не создают собственных миграций. Отдельно оценивать PostgreSQL major upgrade, миграции схемы и совместимость rollout."
    - "Объяснять решения, альтернативы и распределение ответственности между затронутыми репозиториями."
    - "Для изменений границ сервисов описывать контракты, совместимость и порядок внедрения; для изменений данных — миграции и откат."
    - "Опираясь на доступный код, явно отделять установленные факты от предположений и открытых вопросов."
    - "Для integration/e2e явно читать openspec/context/testing.md и ADR 0004; описывать границы реальных зависимостей, изоляцию/очистку данных, manifest версий среды, стабильные test ID и включение в регресс. HTTP health и интеграция ядер в памяти не подтверждают предметный e2e."
  tasks:
    - "Перед tasks.md явно прочитать openspec/context/README.md, architecture-principles.md, technology-stack.md, service-architecture.md и применимые ADR из openspec/context/adr/README.md, затем согласованный design и specs изменения."
    - "Прочитать data-architecture.md для данных/DDL/миграций, api-guidelines.md для контрактов, security.md для авторизации/доверия/аудита, patterns.md для паттернов — все в openspec/context/. Задачи, зависящие от TBD, начинать с явного принятия решения, не скрывать его в реализации."
    - "Использовать нумерованные разделы и чекбоксы - [ ]; формулировать небольшие проверяемые задачи."
    - "Указывать репозиторий каждой задачи и выполнять задачи в порядке их зависимостей."
    - "Для зависимостей предусматривать согласованное обновление pyproject.toml, uv.lock и .python-version в кодовых репозиториях, проверку uv lock --check, воспроизводимую установку uv sync --frozen и тесты; не обновлять версии автоматически из-за политики latest stable."
    - "Задачи DDL/Alembic-миграций относить к db-control; задачи других сервисов не должны создавать собственные миграции или самостоятельно управлять схемой PostgreSQL."
    - "Для каждой существенной фичи MUST включать задачи разработки и запуска автоматизированных тестов, проверяющих требования и критерии приёмки OpenSpec; сохранять проверки затронутого поведения и, где применимо, совместимости контрактов и миграций."
    - "В tasks.md существенной фичи MUST вести прослеживаемость каждого её требования и критерия приёмки: полный путь spec.md + точные названия Requirement/Scenario → репозиторий, путь файла и имя/идентификатор автоматизированного теста (включая параметризованный случай). До реализации допустимы планируемые ссылки; перед завершением заменить их фактическими."
    - "Хранить tasks.md в центральном change; выполнять изменения кода в соответствующих сервисах, не создавая в них локальные specs или changes."
    - "Для межсервисных критериев включать задачи integration/e2e в TamarixTests и связь полный spec path + точные Requirement/Scenario → стабильный test ID → фактический pytest node ID, включая параметризованный случай. CD orchestration планировать отдельным локальным change TamarixCD."
    - "Перед предметным archive предусматривать коллекцию связанных тестов, успешный прогон новых случаев и текущего регресса на фиксированных commits/образах/миграциях, verification/evidence и candidate -> regression в registry.yaml без перемещения исходников. Ноль тестов, skip/xfail обязательного случая или старый evidence не закрывают критерий."
    - "Все тесты проекта MUST иметь содержательное описание на русском: проверяемый сценарий/условия, ожидаемый результат и назначение/применимость. Для Python предусматривать docstring теста и понятные описания различающихся параметризованных случаев; для TamarixTests также description в registry и отчёте. Проверять описания при создании/изменении и включении в регресс; отсутствие описаний существующих тестов оставлять открытой задачей."
    - "Предусмотреть запуск тестов по требованию с выбором набора и отдельным отчётом каждого прогона: русская сводка + JSON, при необходимости JUnit XML; run ID, запрошенные/фактические случаи, версии, время, длительность, статусы/описания/ошибки/артефакты. Отчёт обязателен также при fail, ошибке среды/коллекции или отмене; NOT_RUN отличать от SKIP, incomplete не считать PASS, прежние отчёты не перезаписывать."

operations:
  apply:
    guidance:
      - "Для задач тестирования явно читать openspec/context/testing.md; сохранять ownership TamarixTests, сервисов, TamarixCD и db-control. Принятый процесс не означает реализованную автоматизацию."
      - "У каждого теста проверить русское описание: что он проверяет, ожидаемый результат и для чего применяется, включая параметризованные случаи. Техническое имя теста не заменяет описание."
      - "Выполнять тесты по явному требованию или согласованной задаче проверки и сохранять отчёт каждого прогона, включая неуспех/отмену. Не добавлять незаказанные автоматические триггеры или расписание."
  archive:
    guidance:
      - "Для предметного change явно читать openspec/context/testing.md; проверить traceability/коллекцию, новые тесты и текущий регресс, фиксированные версии и evidence, зафиксированный candidate -> regression. Использовать проектную обёртку и CI gate, когда они реализованы; до этого выполнить проверки явно и не архивировать непроверенные критерии."
      - "Сохранять исходники тестов в TamarixTests, проверять актуальные specs и историю MODIFIED/RENAMED/REMOVED. Указания archive являются advisory и не исполняются самим openspec archive."
      - "До включения тестов в регресс проверить содержательные русские описания в docstrings, registry и отчётах; отсутствие описаний не считать завершённой работой."
      - "Проверять предоставленный отчёт согласованного прогона; archive сам не должен запускать тесты. При отсутствующем/устаревшем/неполном отчёте оставлять change активным и обозначать необходимый запуск по требованию."
